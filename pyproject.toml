[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex"
version = "0.2.0"
description = "Reactive frame-trigger macro engine: armed predicates fire low-latency action sequences when conditions match a screen frame."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kuro" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
]

[project.scripts]
reflex = "reflex.cli:main"

[project.optional-dependencies]
ocr = [
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]
mcp = ["mcp>=1.2"]
all = ["reflex[ocr,mcp]"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reflex = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"
