# Talk to an adjacent character in a tile-based game.
#
# Finds a green blob near the player. If it sits in a tile directly next to
# the player, press the direction that faces it, then the talk button.
#
# player_screen_xy and tile_size_px depend on the game and window size;
# measure them for yours.

macro:
  id: npc_interact_green
  kind: adjacent_sprite_face_talk
  priority: 70
  params:
    sprite:
      predicate: sprite_blob
      region: { x: 250, y: 100, w: 400, h: 400 }
      hsv_lo: [40, 60, 60]
      hsv_hi: [85, 255, 255]
      min_area_px: 80
      max_area_px: 4000
      pick: nearest
      nearest_to_xy: [525, 290]
    player_screen_xy: [525, 290]
    tile_size_px: 32
    talk_button: a
    timeout_s: 30.0
    poll_hz: 30.0
    max_fires: 1
    hold_ms: 60
    inter_press_ms: 50
